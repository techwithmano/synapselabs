kind = "web"
previewPath = "/"
title = "SYNAPSE LABS — Considered Technology"
description = "Biometric sensing, spatial audio, and magnetic power for everyday life, with secure accounts and order history."
version = "1.0.0"
id = "artifacts/klyph-store"
router = "path"

[[services]]
name = "web"
paths = ["/", "/api/products", "/api/auth", "/api/orders", "/api/checkout", "/login", "/signup", "/orders", "/cart", "/success"]
localPort = 25830

[services.development]
run = "pnpm --filter @workspace/klyph-store run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/klyph-store", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/klyph-store", "run", "start"]

[services.production.run.env]
PORT = "25830"
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"

[services.env]
PORT = "25830"
BASE_PATH = "/"
NEXT_TELEMETRY_DISABLED = "1"
