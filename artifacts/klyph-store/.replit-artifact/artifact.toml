kind = "web"
previewPath = "/"
title = "KLYPH — Biometric Sovereign Vault"
description = "A premium KLYPH biometric hardware wallet storefront with database-backed products, live KWD/USD pricing, an interactive cart, and a demo checkout."
version = "1.0.0"
id = "artifacts/klyph-store"
router = "path"

[[services]]
name = "web"
paths = ["/", "/api/products"]
localPort = 25830

[services.development]
run = "pnpm --filter @workspace/klyph-store run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/klyph-store", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/klyph-store", "run", "start"]

[services.production.run.env]
PORT = "25830"
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"

[services.env]
PORT = "25830"
BASE_PATH = "/"
NEXT_TELEMETRY_DISABLED = "1"
