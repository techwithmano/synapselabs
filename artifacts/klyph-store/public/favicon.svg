<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Cobalt Glow Filter -->
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="cobalt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Navy Base Rounded Square -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="#0F172A"/>
  <rect x="16" y="16" width="480" height="480" rx="120" stroke="url(#card-border)" stroke-width="6"/>

  <!-- Subtle Inner Ambient Mesh -->
  <circle cx="256" cy="256" r="180" fill="#1E293B" opacity="0.4"/>

  <!-- Centered Synaptic 'S' Monogram -->
  <!-- Upper Curve of S -->
  <path d="M 340 170 C 340 135 305 105 256 105 C 205 105 168 138 168 184 C 168 238 212 260 262 276 C 316 293 346 318 346 358 C 346 405 306 437 254 437 C 196 437 158 398 156 350"
        stroke="url(#cobalt-grad)" stroke-width="42" stroke-linecap="round" fill="none"
        filter="url(#fav-glow)"/>

  <!-- High-Precision White Core Trace -->
  <path d="M 340 170 C 340 135 305 105 256 105 C 205 105 168 138 168 184 C 168 238 212 260 262 276 C 316 293 346 318 346 358 C 346 405 306 437 254 437 C 196 437 158 398 156 350"
        stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Neural Synapse Telemetry Pulse Nodes -->
  <circle cx="340" cy="170" r="14" fill="#60A5FA" filter="url(#fav-glow)"/>
  <circle cx="340" cy="170" r="6" fill="#FFFFFF"/>

  <circle cx="262" cy="276" r="12" fill="#38BDF8" filter="url(#fav-glow)"/>
  <circle cx="262" cy="276" r="5" fill="#FFFFFF"/>

  <circle cx="156" cy="350" r="14" fill="#2563EB" filter="url(#fav-glow)"/>
  <circle cx="156" cy="350" r="6" fill="#FFFFFF"/>
</svg>
