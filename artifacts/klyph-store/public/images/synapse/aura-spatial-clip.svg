<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="clip-bg" cx="50%" cy="48%" r="62%" fx="50%" fy="42%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </radialGradient>

    <!-- Floating Shadow Filter -->
    <filter id="clip-shadow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="26"/>
      <feOffset dx="0" dy="42"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="ground-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#334155" stop-opacity="0.08"/>
      <stop offset="75%" stop-color="#64748B" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Porcelain White Ceramic Gradient -->
    <linearGradient id="ceramic-arm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="ceramic-highlight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Brushed Titanium Hinge/Bridge -->
    <linearGradient id="titanium-hinge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="25%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="75%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Cobalt Status Dot Glow -->
    <filter id="cobalt-dot-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Acoustic Driver Grille Pattern -->
    <pattern id="acoustic-micro-grille" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.5" fill="#334155" opacity="0.65"/>
    </pattern>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1000" height="820" fill="url(#clip-bg)"/>

  <!-- Blueprint Calibration Circles -->
  <g opacity="0.28" stroke="#CBD5E1" stroke-width="0.75" stroke-dasharray="3 6">
    <circle cx="500" cy="400" r="280" fill="none"/>
    <line x1="140" y1="400" x2="860" y2="400"/>
  </g>

  <!-- Ground Soft Shadow -->
  <ellipse cx="500" cy="640" rx="260" ry="55" fill="url(#ground-shadow)"/>

  <!-- Aura Spatial Clip (Ergonomic C-Cuff Device in Floating Perspective) -->
  <g filter="url(#clip-shadow)" transform="translate(500, 390) rotate(12)">

    <!-- C-Cuff Main Ceramic Arch Outer Path -->
    <path d="M -90,-160 C 90,-220 220,-110 210,50 C 200,190 60,230 -60,200 C -150,175 -190,80 -180,-10 C -170,-70 -130,-130 -90,-160 Z"
          fill="url(#ceramic-arm)"/>

    <!-- Inner Ergonomic Ear Cavity (Hollow Contour) -->
    <path d="M -50,-90 C 60,-130 140,-50 130,50 C 120,130 30,160 -40,140 C -90,120 -115,60 -110,0 C -105,-40 -80,-80 -50,-90 Z"
          fill="url(#clip-bg)"/>

    <!-- Acoustic Transducer Bulb (Front Driver Node) -->
    <g transform="translate(-140, 20)">
      <ellipse cx="0" cy="0" rx="68" ry="74" fill="url(#ceramic-highlight)"/>
      <ellipse cx="0" cy="0" rx="54" ry="60" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
      <ellipse cx="0" cy="0" rx="46" ry="52" fill="url(#acoustic-micro-grille)"/>
      <ellipse cx="0" cy="0" rx="46" ry="52" fill="#0F172A" opacity="0.12"/>
      <!-- Inner Bevel Highlight -->
      <path d="M -30,-30 C 0,-50 30,-30 40,0" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.8"/>
    </g>

    <!-- Brushed Titanium Tension Hinge Bridge -->
    <path d="M 60,-155 C 80,-140 100,-120 120,-90 L 145,-105 C 125,-135 100,-160 80,-175 Z"
          fill="url(#titanium-hinge)"/>
    <path d="M 68,-148 L 138,-100" stroke="#CBD5E1" stroke-width="1.2" opacity="0.9"/>

    <!-- Rear Battery & Spatial Processing Pod -->
    <g transform="translate(160, 20)">
      <ellipse cx="0" cy="0" rx="55" ry="78" fill="url(#ceramic-highlight)"/>
      <!-- Micro Cobalt Blue LED Status Dot -->
      <circle cx="-15" cy="-10" r="5" fill="#2563EB" filter="url(#cobalt-dot-glow)"/>
      <circle cx="-15" cy="-10" r="2" fill="#FFFFFF"/>

      <!-- Precision Laser Etch -->
      <text x="8" y="-7" font-family="Inter, monospace" font-size="7.5" font-weight="700" fill="#64748B" letter-spacing="1">
        AURA // SP-02
      </text>
      <text x="8" y="5" font-family="Inter, monospace" font-size="6.5" font-weight="600" fill="#94A3B8" letter-spacing="0.5">
        SPATIAL-AUDIO
      </text>

      <!-- Microphone Dual Ports -->
      <circle cx="28" cy="30" r="2" fill="#334155"/>
      <circle cx="36" cy="30" r="2" fill="#334155"/>
    </g>

    <!-- Upper Ceramic Arch Specular Ridge Reflection -->
    <path d="M -80,-150 C 70,-200 180,-100 175,40 C 170,-40 90,-150 -70,-135 Z"
          fill="#FFFFFF" opacity="0.85"/>

    <!-- Precision Titanium Hinge Joint Lines -->
    <line x1="80" y1="-170" x2="60" y2="-150" stroke="#334155" stroke-width="1.5"/>
    <line x1="140" y1="-110" x2="120" y2="-90" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- Technical Overlay HUD Badge -->
  <g transform="translate(80, 720)">
    <rect width="210" height="38" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="20" cy="19" r="4" fill="#2563EB" filter="url(#cobalt-dot-glow)"/>
    <text x="34" y="23" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0F172A" letter-spacing="0.5">
      AURA CLIP <tspan fill="#64748B" font-weight="500">| AUDIO 02</tspan>
    </text>
  </g>
</svg>
