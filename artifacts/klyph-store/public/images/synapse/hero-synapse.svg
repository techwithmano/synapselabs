<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1000" width="1280" height="1000" fill="none">
  <defs>
    <!-- Background Studio Gradient -->
    <radialGradient id="hero-bg" cx="50%" cy="46%" r="65%" fx="48%" fy="40%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F8FAFC"/>
      <stop offset="85%" stop-color="#EDF2F7"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="38"/>
      <feOffset dx="0" dy="55"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Contact Shadow -->
    <radialGradient id="contact-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#334155" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#64748B" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Ceramic Outer Gradients -->
    <linearGradient id="ceramic-highlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="ceramic-body" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F1F5F9"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="85%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Titanium Inner Chassis Gradients -->
    <linearGradient id="titanium-core" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="75%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="titanium-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Cobalt LED Telemetry Slit Glow -->
    <filter id="cobalt-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="22" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="cobalt-beam" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#2563EB"/>
      <stop offset="80%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <linearGradient id="sensor-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="45%" stop-color="#1E293B"/>
      <stop offset="80%" stop-color="#2563EB" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="1000" fill="url(#hero-bg)"/>

  <!-- Studio Grid & Technical Coordinates Pattern (Subtle) -->
  <g opacity="0.35" stroke="#CBD5E1" stroke-width="0.75" stroke-dasharray="3 9">
    <line x1="160" y1="80" x2="160" y2="920"/>
    <line x1="1120" y1="80" x2="1120" y2="920"/>
    <line x1="80" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Technical Telemetry Labels -->
  <g font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1.5">
    <text x="180" y="140">SYNAPSE // NEURO-CORE ARCHITECTURE</text>
    <text x="180" y="158" font-size="9" fill="#CBD5E1">ZIRCONIA CERAMIC / TITANIUM GRADE 5</text>
    <text x="960" y="140" text-anchor="end">AXIS: 35.4° ISOMETRIC</text>
    <text x="960" y="158" font-size="9" fill="#2563EB" text-anchor="end">OPTICAL PPG : ACTIVE</text>
  </g>

  <!-- Soft Studio Ground Shadow -->
  <ellipse cx="640" cy="740" rx="360" ry="85" fill="url(#contact-shadow)"/>
  <ellipse cx="640" cy="735" rx="220" ry="42" fill="url(#contact-shadow)" opacity="0.7"/>

  <!-- Main Hardware Object (Synapse Flagship Neuro-Ring in 3D Perspective) -->
  <g filter="url(#soft-shadow)" transform="translate(640, 480) rotate(-16)">

    <!-- Ring Exterior Body Back / Lower Shell -->
    <ellipse cx="0" cy="0" rx="340" ry="215" fill="url(#ceramic-body)"/>

    <!-- Outer Rim Depth / Thickness Layer -->
    <path d="M -340,0 C -340,118 -188,215 0,215 C 188,215 340,118 340,0 L 340,48 C 340,166 188,263 0,263 C -188,263 -340,166 -340,48 Z" fill="url(#ceramic-highlight)"/>

    <!-- Laser-Cut Cobalt Telemetry Slit (Lower Perimeter) -->
    <path d="M -320,18 C -320,126 -176,218 0,218 C 176,218 320,126 320,18 L 320,24 C 320,132 176,224 0,224 C -176,224 -320,132 -320,24 Z"
          fill="url(#cobalt-beam)" filter="url(#cobalt-glow)"/>

    <!-- High-Precision Interior Hollow / Titanium Inner Chassis -->
    <ellipse cx="0" cy="-6" rx="268" ry="164" fill="url(#titanium-bevel)"/>
    <ellipse cx="0" cy="4" rx="252" ry="152" fill="url(#titanium-core)"/>

    <!-- Brushed Inner Wall Shading & Curvature -->
    <path d="M -252,4 C -252,-80 -139,-148 0,-148 C 139,-148 252,-80 252,4 C 252,-40 139,-110 0,-110 C -139,-110 -252,-40 -252,4 Z" fill="#1E293B" opacity="0.65"/>

    <!-- Integrated Sapphire Biometric Sensor Nodes (Interior Array) -->
    <!-- Center Left Sensor -->
    <ellipse cx="-130" cy="-60" rx="20" ry="12" fill="url(#sensor-glass)" transform="rotate(-15 -130 -60)"/>
    <circle cx="-130" cy="-60" r="4" fill="#38BDF8" filter="url(#cobalt-glow)"/>

    <!-- Center Sensor -->
    <ellipse cx="0" cy="-90" rx="24" ry="14" fill="url(#sensor-glass)"/>
    <circle cx="0" cy="-90" r="5" fill="#60A5FA" filter="url(#cobalt-glow)"/>
    <circle cx="0" cy="-90" r="2" fill="#FFFFFF"/>

    <!-- Center Right Sensor -->
    <ellipse cx="130" cy="-60" rx="20" ry="12" fill="url(#sensor-glass)" transform="rotate(15 130 -60)"/>
    <circle cx="130" cy="-60" r="4" fill="#38BDF8" filter="url(#cobalt-glow)"/>

    <!-- Outer Porcelain Front Bevel (Top Curve Highlight) -->
    <path d="M -340,0 C -340,-118 -188,-215 0,-215 C 188,-215 340,-118 340,0 C 320,-85 180,-165 0,-165 C -180,-165 -320,-85 -340,0 Z"
          fill="#FFFFFF" opacity="0.95"/>

    <!-- Gloss Specular Reflection Across Top Crest -->
    <path d="M -230,-120 C -140,-185 -40,-208 60,-205 C 120,-203 200,-175 250,-130 C 190,-160 110,-182 40,-182 C -50,-182 -140,-155 -230,-120 Z"
          fill="#FFFFFF" opacity="0.7"/>

    <!-- Micro Precision Titanium Laser Markings -->
    <text x="0" y="80" text-anchor="middle" font-family="Inter, monospace" font-size="9" font-weight="700" fill="#94A3B8" letter-spacing="4">
      SYNAPSE CORE • TI-05 // BIO-OS
    </text>
  </g>

  <!-- Foreground Calibration Accent Marks -->
  <g stroke="#2563EB" stroke-width="1.5" opacity="0.85">
    <line x1="280" y1="780" x2="310" y2="780"/>
    <line x1="280" y1="780" x2="280" y2="760"/>
    <circle cx="310" cy="780" r="2.5" fill="#2563EB"/>
  </g>
  <text x="325" y="784" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">
    01 // CHASSIS SURFACE: 1200nm POLISHED CERAMIC
  </text>
</svg>
