<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="slate-bg" cx="50%" cy="48%" r="62%" fx="50%" fy="42%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </radialGradient>

    <!-- Floating Shadow Filter -->
    <filter id="slate-shadow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="30"/>
      <feOffset dx="0" dy="48"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="slate-ground" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#334155" stop-opacity="0.1"/>
      <stop offset="75%" stop-color="#64748B" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Porcelain Glass-Ceramic Top Plate -->
    <linearGradient id="ceramic-plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F8FAFC"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Chamfered Aluminum Unibody Edge -->
    <linearGradient id="aluminum-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="aluminum-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Illuminated Cobalt Halo Glow -->
    <filter id="halo-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="halo-ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="40%" stop-color="#2563EB"/>
      <stop offset="80%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1000" height="820" fill="url(#slate-bg)"/>

  <!-- Blueprint Calibration Grid Lines -->
  <g opacity="0.3" stroke="#CBD5E1" stroke-width="0.75" stroke-dasharray="2 6">
    <line x1="120" y1="410" x2="880" y2="410"/>
    <circle cx="500" cy="410" r="320" fill="none"/>
  </g>

  <!-- Ground Soft Shadow -->
  <ellipse cx="500" cy="620" rx="300" ry="70" fill="url(#slate-ground)"/>

  <!-- NeuroDock Monolithic Slate (Isometric Projection) -->
  <g filter="url(#slate-shadow)" transform="translate(500, 400)">

    <!-- Bottom CNC Aluminum Base Bevel -->
    <path d="M 0,-140 L 290,0 L 0,140 L -290,0 Z" fill="url(#aluminum-base)"/>

    <!-- Aluminum Sub-Chassis Vertical Depth (Chamfer Skirt) -->
    <path d="M -290,0 L -290,26 L 0,166 L 290,26 L 290,0 L 0,140 Z" fill="url(#aluminum-edge)"/>

    <!-- High-Luster Beveled Ceramic Edge (Plate Rim) -->
    <path d="M 0,-146 L 294,-6 L 0,134 L -294,-6 Z" fill="#E2E8F0"/>

    <!-- Solid Porcelain Ceramic Top Surface -->
    <path d="M 0,-142 L 288,-2 L 0,138 L -288,-2 Z" fill="url(#ceramic-plate)"/>

    <!-- Specular Reflection Across Slate Surface -->
    <path d="M -180,-60 L 50,-130 L 120,-100 L -120,-30 Z" fill="#FFFFFF" opacity="0.85"/>

    <!-- Concentric Magnetic Inductive Puck Recess (Outer Depressed Ring) -->
    <ellipse cx="0" cy="0" rx="155" ry="78" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Illuminated Cobalt Status Halo Ring -->
    <ellipse cx="0" cy="0" rx="142" ry="70" fill="none" stroke="url(#halo-ring-gradient)" stroke-width="4.5" filter="url(#halo-glow)"/>
    <ellipse cx="0" cy="0" rx="142" ry="70" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>

    <!-- Inner Magnetic Ceramic Core Pad -->
    <ellipse cx="0" cy="0" rx="124" ry="60" fill="url(#ceramic-plate)"/>
    <ellipse cx="0" cy="0" rx="118" ry="56" fill="#F8FAFC"/>

    <!-- Center Magnetic Crosshair / Sensor Alignment Glyph -->
    <g stroke="#94A3B8" stroke-width="1" opacity="0.6">
      <ellipse cx="0" cy="0" rx="36" ry="18" fill="none"/>
      <line x1="-18" y1="0" x2="18" y2="0"/>
      <line x1="0" y1="-9" x2="0" y2="9"/>
    </g>

    <!-- Micro Pulsing Telemetry Dot in Center -->
    <circle cx="0" cy="0" r="3.5" fill="#2563EB" filter="url(#halo-glow)"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>

    <!-- Laser Engraved Corner Telemetry Label -->
    <g transform="translate(-190, 60) rotate(-26)">
      <text x="0" y="0" font-family="Inter, monospace" font-size="8" font-weight="700" fill="#64748B" letter-spacing="2">
        NEURODOCK // MAG-15W
      </text>
      <text x="0" y="10" font-family="Inter, monospace" font-size="7" font-weight="600" fill="#94A3B8" letter-spacing="1">
        SYNAPSE POWER LABS
      </text>
    </g>
  </g>

  <!-- Technical Overlay HUD Badge -->
  <g transform="translate(80, 720)">
    <rect width="210" height="38" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="20" cy="19" r="4" fill="#2563EB" filter="url(#halo-glow)"/>
    <text x="34" y="23" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0F172A" letter-spacing="0.5">
      NEURODOCK <tspan fill="#64748B" font-weight="500">| POWER 03</tspan>
    </text>
  </g>
</svg>
